[package]
name = "dsh-desktop"
version = "0.1.1"
edition = "2021"
# Tauri v2 requires >= 1.77.2; we pin the toolchain in rust-toolchain.toml.
rust-version = "1.77.2"
description = "Lightweight Tauri desktop shell for DeepSeek Harness"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to >= 2.11.1: CVE-2026-42184 (remote origin -> local-only IPC) is fixed there.
#
# `unstable` is required for multi-webview (`Window::add_child` is gated behind
# it). That is how the tab bar, the harness UI, and the terminal live as sibling
# webviews in one window. Keeping the harness page the *top-level* document of
# its own webview is deliberate: it keeps the harness `/api` trust fence out of
# the question entirely (see PLAN.md §3). If this feature ever breaks, the
# fallback is a stable build with the harness in an iframe — and the fence
# behaviour of that path must be verified first.
#
# `macos-private-api` is what makes a transparent webview possible on macOS
# (`WebviewBuilder::transparent` is gated behind it). We want it so the tab strip
# can sit on the window's own background with no fill. Both reference
# implementations enable this too. Trade-off: it uses private AppKit surface, so
# it rules out Mac App Store distribution — which was never a target.
tauri = { version = "2.11.1", features = ["unstable", "macos-private-api"] }
# SIGTERM to the sidecar so dsh disposes its fiber tree gracefully (exit 0).
libc = "0.2"

# Runtime acquisition (Phase 1.1).
# HTTP is done in-process with a Rust client on purpose: shelling out to
# curl/tar risks stamping com.apple.quarantine onto the extracted tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

# Real PTY for the terminal tab. Compiled in and unconditional; only the
# emulator front-end is downloaded on demand (src/terminal.rs).
portable-pty = "0.9.0"
# Fonts are handed to the page as data: URLs.
base64 = "0.22"

[profile.dev]
incremental = true
