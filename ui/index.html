<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.7;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .label { opacity: 0.75; }
      .hint { opacity: 0.45; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div class="label">Starting DeepSeek Harness…</div>
    <div class="hint">The first launch may take a moment.</div>
  </body>
</html>
