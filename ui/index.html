<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabs</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        display: flex;
        align-items: stretch;
        gap: 2px;
        padding: 0 8px;
        font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: color-mix(in srgb, currentColor 6%, transparent);
        border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
        /* The strip is app chrome, not content: let it drag the window. */
        -webkit-app-region: drag;
        user-select: none;
      }
      button {
        -webkit-app-region: no-drag;
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0 14px;
        margin: 5px 0;
        border-radius: 6px;
        cursor: default;
        opacity: 0.6;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      button:hover { opacity: 0.85; background: color-mix(in srgb, currentColor 8%, transparent); }
      button[aria-selected="true"] {
        opacity: 1;
        background: color-mix(in srgb, currentColor 14%, transparent);
        font-weight: 600;
      }
      .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: currentColor; opacity: 0.5;
      }
      .spacer { flex: 1; }
      .status {
        -webkit-app-region: no-drag;
        display: flex; align-items: center;
        font-size: 11px; opacity: 0.5;
        padding-right: 4px;
      }
    </style>
  </head>
  <body>
    <button id="tab-agent" aria-selected="true" data-tab="agent">
      <span class="dot"></span>Agent
    </button>
    <button id="tab-terminal" aria-selected="false" data-tab="terminal">
      <span class="dot"></span>Terminal
    </button>
    <span class="spacer"></span>
    <span class="status" id="status">Starting…</span>

    <script>
      // This page is local (tauri://localhost) and is the only surface granted
      // IPC. The harness page lives in a separate webview and gets none.
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

      let current = "agent";

      function paint(tab) {
        for (const button of document.querySelectorAll("button[data-tab]")) {
          button.setAttribute("aria-selected", String(button.dataset.tab === tab));
        }
      }

      async function select(tab) {
        if (tab === current) return;
        // Only move the highlight once Rust confirms the switch, so the bar can
        // never disagree with what is actually on screen.
        try {
          await invoke("select_tab", { tab });
          current = tab;
          paint(tab);
        } catch (error) {
          setStatus("Switch failed");
          console.error(error);
        }
      }

      for (const button of document.querySelectorAll("button[data-tab]")) {
        button.addEventListener("click", () => select(button.dataset.tab));
      }

      function setStatus(text) {
        document.getElementById("status").textContent = text;
      }
      // Called from Rust.
      window.__dshStatus = setStatus;
      window.__dshSelect = (tab) => { current = tab; paint(tab); };

      invoke("shell_status")
        .then((s) => setStatus(s))
        .catch(() => setStatus(""));
    </script>
  </body>
</html>
