<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rail</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #4d6bfe;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        /* Clears the title bar band so the first icon lines up with the top of
           the content area rather than the traffic lights. */
        padding: 38px 0 10px;
        background: transparent;
        color: inherit;
        -webkit-app-region: drag;
        user-select: none;
      }
      button {
        -webkit-app-region: no-drag;
        appearance: none;
        border: 0;
        background: none;
        color: inherit;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        cursor: default;
        /* Selection is carried by colour alone — no fill, no pill. */
        opacity: 0.4;
      }
      button:hover { opacity: 0.7; }
      button[aria-selected="true"] {
        opacity: 1;
        color: var(--accent);
      }
      /* Pushed to the bottom, away from the tabs, so it reads as a notification
         rather than another surface. */
      #update { margin-top: auto; }
      #update:not([hidden]) { opacity: 0.9; color: var(--accent); }
      /* A `display` rule on the button would otherwise beat the UA's [hidden]. */
      #update[hidden] { display: none; }
      #update[disabled] { opacity: 0.4; }
      /* The tabs start hidden and are revealed by Rust once the harness is up:
         switching to a surface that does not exist yet is not an offer worth
         making. Defaulting to hidden avoids a race with the first paint. */
      button[data-tab][hidden] { display: none; }
      svg { width: 18px; height: 18px; display: block; }
    </style>
  </head>
  <body>
    <button id="tab-agent" aria-selected="true" data-tab="agent" title="Agent" hidden>
      <!-- chat bubble: the agent surface -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
    </button>

    <button id="tab-terminal" aria-selected="false" data-tab="terminal" title="Terminal" hidden>
      <!-- terminal prompt: chevron + cursor -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="5 8 9 12 5 16" />
        <line x1="12" y1="16" x2="19" y2="16" />
      </svg>
    </button>

    <!-- Shown only when the release feed offers a newer version. -->
    <button id="update" title="Check for updates" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4v10" />
        <polyline points="8 11 12 15 16 11" />
        <path d="M5 18h14" />
      </svg>
    </button>

    <script>
      // This page is local (tauri://localhost) and is the only surface granted
      // IPC. The harness webview gets none.
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

      let current = "agent";

      function paint(tab) {
        for (const button of document.querySelectorAll("button[data-tab]")) {
          button.setAttribute("aria-selected", String(button.dataset.tab === tab));
        }
      }

      async function select(tab) {
        if (tab === current) return;
        // Only move the highlight once Rust confirms the switch, so the rail can
        // never disagree with what is actually on screen.
        try {
          await invoke("select_tab", { tab });
          current = tab;
          paint(tab);
        } catch (error) {
          console.error("tab switch failed", error);
        }
      }

      for (const button of document.querySelectorAll("button[data-tab]")) {
        button.addEventListener("click", () => select(button.dataset.tab));
      }

      // There is no room for a status line in a 48px rail; the loading page
      // carries startup progress. Kept defined so Rust's eval is a no-op safe.
      window.__dshStatus = (text) => {
        document.body.title = text || "";
      };
      window.__dshSelect = (tab) => { current = tab; paint(tab); };

      // Driven from Rust. "loading" hides the tabs; "ready" reveals them.
      window.__dshShellState = (state) => {
        const ready = state === "ready";
        for (const button of document.querySelectorAll("button[data-tab]")) {
          button.hidden = !ready;
        }
      };

      // --- updates -----------------------------------------------------------
      const updateButton = document.getElementById("update");
      let updating = false;

      // A failure is not worth interrupting anyone over: an unreachable feed
      // simply means no update is offered.
      invoke("update_check")
        .then((info) => {
          if (!info || !info.available) return;
          updateButton.hidden = false;
          updateButton.title = `Update to ${info.version} — click to install`;
        })
        .catch(() => {});

      updateButton.addEventListener("click", async () => {
        if (updating) return;
        updating = true;
        updateButton.disabled = true;
        updateButton.title = "Installing update…";
        try {
          // On success the app relaunches, so nothing after this runs.
          await invoke("update_install");
        } catch (error) {
          updating = false;
          updateButton.disabled = false;
          updateButton.title = String(error);
        }
      });

      // Restore state on load: if this page is ever reloaded, the tabs must not
      // stay hidden just because the one-shot "ready" push already happened.
      invoke("shell_status")
        .then((state) => {
          window.__dshShellState(state);
          document.body.title = state === "ready" ? "" : "Starting…";
        })
        .catch(() => {});
    </script>
  </body>
</html>
