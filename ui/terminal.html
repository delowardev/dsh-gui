<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terminal</title>
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <style>
      /* Monaspace Krypton (SIL OFL 1.1), vendored under ui/vendor. Served from
         the bundle rather than data: URLs now that the terminal ships with the
         app, so the font is a plain relative reference. */
      @font-face {
        font-family: "Monaspace Krypton";
        src: url("./vendor/font-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Monaspace Krypton";
        src: url("./vendor/font-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: "Monaspace Krypton";
        src: url("./vendor/font-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Monaspace Krypton";
        src: url("./vendor/font-700-italic.woff2") format("woff2");
        font-weight: 700;
        font-style: italic;
        font-display: block;
      }

      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      #session { display: flex; height: 100%; }

      #sidebar {
        width: 200px;
        flex: none;
        display: flex;
        flex-direction: column;
        min-width: 120px;
        background: color-mix(in srgb, currentColor 4%, transparent);
        border-right: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }
      #sidebar .head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 6px 8px 6px 10px;
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
        opacity: 0.5;
      }
      #sidebar .head button {
        appearance: none; border: 0; background: none; color: inherit;
        font: inherit; font-size: 15px; line-height: 1; padding: 2px 5px;
        border-radius: 5px; cursor: default; opacity: 0.8;
      }
      #sidebar .head button:hover { background: color-mix(in srgb, currentColor 12%, transparent); opacity: 1; }
      #list { list-style: none; margin: 0; padding: 0 6px 8px; overflow-y: auto; flex: 1; }
      #list li {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 6px 5px 9px; border-radius: 6px; cursor: default;
        opacity: 0.65;
      }
      #list li:hover { background: color-mix(in srgb, currentColor 7%, transparent); opacity: 0.9; }
      #list li[aria-selected="true"] {
        opacity: 1;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      #list li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #list li .kill {
        appearance: none; border: 0; background: none; color: inherit;
        font: inherit; font-size: 13px; line-height: 1; padding: 1px 4px;
        border-radius: 4px; opacity: 0; cursor: default;
      }
      #list li:hover .kill { opacity: 0.6; }
      #list li .kill:hover { background: color-mix(in srgb, currentColor 14%, transparent); opacity: 1; }

      /* Drag to resize the sidebar. */
      #splitter { width: 4px; flex: none; cursor: col-resize; }
      #splitter:hover { background: color-mix(in srgb, currentColor 14%, transparent); }

      /* The terminal fills the remaining area exactly. No padding here: fit()
         measures this box, so padding would make it compute one row too many
         and leave a strip of background showing. */
      #area { position: relative; flex: 1; overflow: hidden; }
      .pane { position: absolute; inset: 0; display: none; }
      .pane[data-active="true"] { display: block; }
      /* Padding goes on the terminal element, not a wrapper. FitAddon reads the
         parent's height and subtracts the terminal element's own padding, so
         this is the one place it can live without the grid being measured
         against a box the text does not actually occupy. `border-box` keeps the
         100% height inclusive of it. Padding belongs here rather than on #area
         so the sidebar stays flush. */
      .pane .xterm {
        height: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
      }

      /* xterm.css hardcodes `.xterm-viewport { background-color: #000 }` and
         `overflow-y: scroll`, which showed through as a black band below the
         last row and as a full-width native scrollbar. Both are overridden:
         the viewport is transparent so the pane's theme colour shows, and the
         scrollbar becomes a slim overlay. */
      .pane .xterm-viewport {
        background-color: transparent !important;
        scrollbar-width: thin;
      }
      .pane .xterm-viewport::-webkit-scrollbar { width: 8px; }
      .pane .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
      .pane .xterm-viewport::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 4px;
      }
      .pane .xterm-viewport::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.32);
      }

      #empty {
        position: absolute; inset: 0; display: none;
        align-items: center; justify-content: center; opacity: 0.5;
      }
      #empty.visible { display: flex; }

      #error {
        display: none; position: absolute; left: 12px; right: 12px; bottom: 12px;
        padding: 10px 12px; border-radius: 6px; font-size: 11px;
        white-space: pre-wrap; word-break: break-word;
        color: #fff; background: rgba(220, 50, 47, 0.92);
      }
      #error.visible { display: block; }
    </style>
  </head>
  <body>
    <div id="session">
      <aside id="sidebar">
        <div class="head"><span>Terminals</span><button id="new" title="New terminal">+</button></div>
        <ul id="list"></ul>
      </aside>
      <div id="splitter" title="Drag to resize"></div>
      <div id="area">
        <div id="empty">No terminals open</div>
        <div id="error"></div>
      </div>
    </div>

    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/addon-fit.js"></script>
    <script>
      // A local surface. Terminal commands are accepted only from this webview.
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

      const errorView = document.getElementById("error");
      const listView = document.getElementById("list");
      const areaView = document.getElementById("area");
      const emptyView = document.getElementById("empty");

      // Vira Graphene, read from the installed theme's `terminal.ansi*` keys
      // (vira.vsc-vira-theme 2026.9.2) rather than eyeballed from a screenshot,
      // so every slot is the theme's own value. VS Code omits
      // `terminal.background`/`foreground` here, which means the terminal
      // inherits the editor colours — hence background/foreground below.
      const THEME = {
        background: "#212121",          // editor.background
        foreground: "#D9D9D9",          // editor.foreground
        cursor: "#FFCB6B",              // terminalCursor.foreground
        cursorAccent: "#000000",        // terminalCursor.background
        selectionBackground: "#47474780", // editor.selectionBackground
        black: "#000000",
        red: "#f07178",
        green: "#C3E88D",
        yellow: "#FFCB6B",
        blue: "#82AAFF",
        magenta: "#C792EA",
        cyan: "#89DDFF",
        white: "#ffffff",
        brightBlack: "#545454",
        brightRed: "#f07178",
        brightGreen: "#C3E88D",
        brightYellow: "#FFCB6B",
        brightBlue: "#82AAFF",
        brightMagenta: "#C792EA",
        brightCyan: "#89DDFF",
        brightWhite: "#ffffff",
      };

      const FONT_STACK = '"Monaspace Krypton", ui-monospace, SFMono-Regular, Menlo, monospace';

      /** id -> { id, title, term, fit, pane } */
      const sessions = new Map();
      let activeId = null;
      let polling = false;

      function showError(message) {
        errorView.textContent = message;
        errorView.classList.add("visible");
      }

      /** Wait for Monaspace Krypton, or the grid is measured against fallback
       *  metrics — the cell size then changes under xterm once the font lands,
       *  leaving the rows short of the container. */
      async function ensureFonts() {
        if (!document.fonts) return;
        try {
          await Promise.all([
            document.fonts.load('400 12px "Monaspace Krypton"'),
            document.fonts.load('italic 400 12px "Monaspace Krypton"'),
            document.fonts.load('700 12px "Monaspace Krypton"'),
            document.fonts.load('italic 700 12px "Monaspace Krypton"'),
          ]);
          await document.fonts.ready;
        } catch {
          // Fall through: a missing font degrades to the fallback stack.
        }
      }

      function renderList() {
        listView.replaceChildren();
        for (const session of sessions.values()) {
          const item = document.createElement("li");
          item.setAttribute("aria-selected", String(session.id === activeId));
          item.addEventListener("click", () => activate(session.id));

          const name = document.createElement("span");
          name.className = "name";
          name.textContent = session.title;
          item.appendChild(name);

          const kill = document.createElement("button");
          kill.className = "kill";
          kill.textContent = "×";
          kill.title = "Close terminal";
          kill.addEventListener("click", (event) => {
            event.stopPropagation();
            closeSession(session.id);
          });
          item.appendChild(kill);

          listView.appendChild(item);
        }
        emptyView.classList.toggle("visible", sessions.size === 0);
      }

      /** Attach xterm to a session the backend already knows about. */
      function attach(info) {
        const pane = document.createElement("div");
        pane.className = "pane";
        // Match the terminal background so any sub-cell remainder below the last
        // row is invisible instead of reading as a black bar.
        pane.style.background = THEME.background;
        areaView.insertBefore(pane, errorView);

        const term = new window.Terminal({
          fontFamily: FONT_STACK,
          fontSize: 12,
          fontWeight: 400,
          fontWeightBold: 700,
          lineHeight: 1.2,
          letterSpacing: 0,
          cursorBlink: true,
          theme: THEME,
          scrollback: 5000,
        });
        const fit = new window.FitAddon.FitAddon();
        term.loadAddon(fit);
        term.open(pane);
        // The pane is hidden until activated, so measuring now would give zero.
        // It is fitted in `activate`.

        sessions.set(info.id, { ...info, term, fit, pane });

        term.onData((data) => invoke("terminal_write", { id: info.id, data }).catch(() => {}));
        term.onResize(({ cols, rows }) =>
          invoke("terminal_resize", { id: info.id, cols, rows }).catch(() => {}),
        );
      }

      async function newSession() {
        const current = activeId ? sessions.get(activeId) : null;
        // Reuse the active size so a new pane does not visibly reflow.
        const cols = current?.term.cols ?? 80;
        const rows = current?.term.rows ?? 24;
        try {
          const id = await invoke("terminal_open", { cols, rows });
          attach({ id, title: `Terminal ${sessions.size + 1}` });
          await activate(id);
        } catch (error) {
          showError("Could not start a shell.\n" + String(error));
        }
      }

      async function activate(id) {
        if (!sessions.has(id)) return;
        activeId = id;
        for (const session of sessions.values()) {
          session.pane.dataset.active = String(session.id === id);
        }
        renderList();
        // Fit only once the pane is displayed, or the measurement is zero.
        const session = sessions.get(id);
        requestAnimationFrame(() => {
          try {
            session.fit.fit();
          } catch {}
          session.term.focus();
        });
      }

      function closeSession(id) {
        sessions.get(id)?.term.dispose();
        sessions.get(id)?.pane.remove();
        sessions.delete(id);
        invoke("terminal_close", { id }).catch(() => {});
        if (activeId === id) {
          const next = sessions.keys().next();
          activeId = next.done ? null : next.value;
          if (activeId) activate(activeId);
        }
        renderList();
      }

      // Output is drained rather than pushed: a Tauri event stream is a
      // core-plugin command and would need a capability, while these are our own
      // commands. See the note in src-tauri/src/terminal.rs.
      function startPolling() {
        if (polling) return;
        polling = true;
        setInterval(async () => {
          for (const session of sessions.values()) {
            if (session.reading) continue;
            session.reading = true;
            try {
              const chunk = await invoke("terminal_read", { id: session.id });
              if (chunk) session.term.write(chunk);
            } catch {
              // Transient; keep polling.
            } finally {
              session.reading = false;
            }
          }
        }, 25);
      }

      function refit() {
        const session = activeId ? sessions.get(activeId) : null;
        if (!session) return;
        try {
          session.fit.fit();
        } catch {}
      }

      // Re-fit whenever the area actually changes size — window resize, sidebar
      // drag, or the tab becoming visible. A window resize listener misses all
      // but the first.
      new ResizeObserver(refit).observe(areaView);

      // A late font swap changes cell metrics without resizing the container, so
      // the ResizeObserver would never see it.
      document.fonts?.addEventListener("loadingdone", refit);

      // --- sidebar drag ---
      (() => {
        const sidebar = document.getElementById("sidebar");
        const splitter = document.getElementById("splitter");
        let dragging = false;
        splitter.addEventListener("mousedown", (event) => {
          dragging = true;
          event.preventDefault();
        });
        window.addEventListener("mousemove", (event) => {
          if (!dragging) return;
          sidebar.style.width = Math.min(Math.max(event.clientX, 120), 480) + "px";
        });
        window.addEventListener("mouseup", () => { dragging = false; });
      })();

      document.getElementById("new").addEventListener("click", () => newSession());

      (async () => {
        try {
          // If the vendored front-end failed to load, say so plainly rather than
          // leaving a blank pane and an unhandled rejection.
          if (!window.Terminal || !window.FitAddon) {
            throw new Error(
              "the terminal front-end did not load (expected ui/vendor/xterm.js)",
            );
          }

          // Adopt the terminal palette for the whole page, so the sidebar is part
          // of the terminal rather than app chrome sitting beside it. The sidebar
          // derives its shades from currentColor, so it follows automatically.
          document.body.style.background = THEME.background;
          document.body.style.color = THEME.foreground;
          // Must happen before any terminal measures itself.
          await ensureFonts();

          const existing = await invoke("terminal_list").catch(() => []);
          if (existing.length === 0) {
            await newSession();
          } else {
            for (const info of existing) attach(info);
            await activate(existing[0].id);
          }
          startPolling();
        } catch (error) {
          showError("Could not open the terminal.\n" + String(error));
        }
      })();
    </script>
  </body>
</html>
