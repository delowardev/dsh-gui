<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terminal</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card { max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
      h1 { font-size: 14px; margin: 0; font-weight: 600; }
      p { margin: 0; opacity: 0.65; font-size: 12px; }
      button {
        align-self: center;
        margin-top: 6px;
        padding: 7px 16px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        background: color-mix(in srgb, currentColor 10%, transparent);
        color: inherit;
        font: inherit;
        cursor: default;
      }
      button:hover { background: color-mix(in srgb, currentColor 16%, transparent); }
      .note { font-size: 11px; opacity: 0.45; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Terminal isn't installed</h1>
      <p>
        The terminal and its dependencies are downloaded on demand, so they stay
        out of the base install.
      </p>
      <button id="install">Install terminal…</button>
      <p class="note" id="note">Downloads a terminal UI bundle. Nothing else changes.</p>
    </div>

    <script>
      // This page is a local surface, but the install path is owned by Rust.
      const note = document.getElementById("note");
      document.getElementById("install").addEventListener("click", () => {
        note.textContent = "Not implemented yet — coming in the terminal phase.";
      });
    </script>
  </body>
</html>
